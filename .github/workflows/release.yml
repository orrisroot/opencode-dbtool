name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: opencode-dbtool

jobs:
  check-version:
    name: Verify tag matches Cargo.toml version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Extract and compare version
        id: version
        run: |
          version="$(grep -m1 '^version' Cargo.toml | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')"
          tag="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          if [ "${version}" != "${tag}" ]; then
            echo "::error::tag '${GITHUB_REF_NAME}' does not match Cargo.toml version '${version}'"
            exit 1
          fi
          echo "::notice::tag ${GITHUB_REF_NAME} matches Cargo.toml version ${version}"

  build:
    name: Build ${{ matrix.target }}
    needs: check-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest }
          - { target: x86_64-apple-darwin, os: macos-13 }
          - { target: aarch64-apple-darwin, os: macos-14 }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-latest }
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build (Linux musl via cross)
        if: runner.os == 'Linux'
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Build (macOS / Windows)
        if: runner.os != 'Linux'
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            *pc-windows*) ext=".exe" ;;
            *)            ext="" ;;
          esac
          dir="${BIN_NAME}-${{ matrix.target }}"
          mkdir -p "dist/${dir}"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}${ext}" "dist/${dir}/"
          cp README.md LICENSE "dist/${dir}/"
          if [[ "${{ matrix.target }}" == *pc-windows* ]]; then
            (cd dist && 7z a -tzip "../${dir}.zip" "${dir}") >/dev/null
          else
            tar -C dist -czf "${dir}.tar.gz" "${dir}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.BIN_NAME }}-${{ matrix.target }}.tar.gz
            ${{ env.BIN_NAME }}-${{ matrix.target }}.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [check-version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List assets
        run: ls -lR artifacts

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: opencode-dbtool v${{ needs.check-version.outputs.version }}
          files: artifacts/**
          generate_release_notes: true