[package]
name = "opencode-dbtool"
version = "0.1.0"
edition = "2021"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
self_update = { version = "1.3.0", default-features = false, features = ["github", "ureq", "rustls", "archive-tar", "compression-tar-gz", "archive-zip", "compression-zip-deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sysinfo = "0.39.6"

[profile.release]
strip = true
lto = true
