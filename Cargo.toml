[package]
name = "opencode-dbtool"
version = "0.5.1"
edition = "2021"

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.10", features = ["derive"] }
clap_complete = "4.6.12"
crossterm = "0.29.0"
fs2 = "0.4.3"
rusqlite = { version = "0.43", features = ["backup", "bundled"] }
self_update = { version = "1.3.3", default-features = false, features = ["github", "ureq", "rustls", "archive-tar", "compression-tar-gz", "archive-zip", "compression-zip-deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sysinfo = "0.40.4"
toml = "1.2.3"
unicode-width = "0.2"
ureq = "3.5.2"

[profile.release]
strip = true
lto = true
